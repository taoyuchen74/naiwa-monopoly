name: Browser paths
on:
  workflow_call:
    inputs:
      from-ci:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore exact build from CI
        if: inputs.from-ci
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out/
      - name: Build for standalone manual execution
        if: ${{ !inputs.from-ci }}
        run: npm run build:site
      # GitHub's ubuntu-24.04 image already ships Chrome's native libraries.
      # Avoid apt upgrades / optional JP-TH fonts: the game bundles its UI font.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
