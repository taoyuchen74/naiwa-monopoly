name: Verify game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check JavaScript contracts
        run: npm run typecheck
      - name: Unit and complete-game tests
        run: npm run test:coverage
      - name: Lint changed files
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: npm run lint
      - name: Install Chromium and system libraries
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Forest WebGL interactions
        env:
          NAIWA_FOREST_WEBGL: '1'
        run: npx playwright test e2e-ci/forest.spec.mjs --grep WebGL
      - name: Forest map and quality resource lifecycle
        run: npm run test:forest:resources
      - name: Engineering browser regressions
        run: npm run test:e2e
      - name: Two-client online browser tests
        run: npm run test:online
      - name: Two-device cloud save browser tests
        run: npm run test:cloud
      - name: Build site and portable game
        run: npm run build
      - name: Report artifact sizes
        run: npm run check:size
      - name: Upload browser report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-results-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            coverage/
            artifacts/size-report.json
            artifacts/forest-*.json
            artifacts/forest-ui-*.png
          if-no-files-found: ignore
          retention-days: 7
