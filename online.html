<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>奶蛙大富翁 · 在线房间</title><link rel="stylesheet" href="./assets/online-style.db4ae95a8a11.css"></head>
<body><main>
 <header><a href="./">返回单机</a><h1>奶蛙在线房间</h1><p>2—6人 · 服务端掷骰与结算 · 无账号</p></header>
 <p id="connection" role="status">正在检查房间服务…</p>
 <p class="notice">联机存档与单机分开，仅在服务进程内保存，重启丢失。暂不支持导入导出、组合交易和自选模式。</p>
 <section id="entrance" aria-labelledby="entranceTitle"><h2 id="entranceTitle">创建或加入</h2><label for="onlineName">玩家名称（1—16字）</label><input id="onlineName" maxlength="16" value="奶伴" autocomplete="nickname"><label for="roomCode">6位邀请码</label><input id="roomCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"><div class="buttons"><button id="createRoom">创建房间</button><button id="joinRoom">加入房间</button></div></section>
 <section id="room" hidden aria-labelledby="roomTitle"><h2 id="roomTitle"></h2><p id="roomMeta"></p><div id="seatList"></div><div class="buttons"><button id="readyRoom">准备</button><button id="startRoom">开始对局</button><button id="controlRoom">交给AI托管</button></div></section>
 <section id="onlineGame" hidden aria-labelledby="gameTitle"><h2 id="gameTitle">联机对局</h2><p id="turnStatus"></p><p id="deadline"></p><p id="gameNotice"></p><div class="online-layout"><div><h3>轻量地图</h3><div id="onlineMap" role="list" aria-label="地图位置与地产"></div></div><section id="operationPanel" aria-labelledby="operationTitle"><h3 id="operationTitle">我的操作</h3><p id="privateAccount"></p><p id="myCards"></p><div id="ruleActions" class="buttons"></div><form id="auctionForm" hidden><h4>竞价</h4><label for="onlineBid">报价</label><input id="onlineBid" type="number" inputmode="numeric" min="1"><button type="submit">确认出价</button></form><form id="bankForm" hidden><h4>银行</h4><label for="onlineBankKind">业务</label><select id="onlineBankKind"><option value="deposit">存款</option><option value="withdraw">取款</option><option value="borrow">贷款</option><option value="repay">还款</option></select><label for="onlineBankAmount">金额</label><input id="onlineBankAmount" type="number" inputmode="numeric" min="1" value="100"><button type="submit">提交银行命令</button></form><form id="stockForm" hidden><h4>股票</h4><label for="onlineStock">股票</label><select id="onlineStock"></select><label for="onlineStockQty">股数（负数为卖出）</label><input id="onlineStockQty" type="number" inputmode="numeric" value="1"><button type="submit">提交股票命令</button></form></section></div></section>
 <p id="commandStatus" role="status" aria-live="polite"></p><details><summary>同步信息与恢复</summary><p id="syncInfo"></p><button id="reconnectRoom">重新连接</button><button id="forgetRoom">清除本页房间提示</button><p>Cookie丢失无法找回原席；邀请码只能加入未开始的房间。已超时的当前回合交给AI，下一回合前可接回。</p></details>
</main><script defer src="./assets/online.16e487a28d14.js"></script></body></html>
